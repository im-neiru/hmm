[package]
name = "hmm"
version = "0.1.0"
edition = "2024"

[features]
default = ["vulkan"]

cuda = ["burn/cuda"]
vulkan = ["burn/vulkan"]

[dependencies]
# async runtime
tokio = { version = "1.54.0", default-features = false, features = [
    "fs",
    "io-std",
    "io-util",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
] }

# data structures & math
half = "2.7"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"

# error handling
miette = "7.6.0"
thiserror = "2.0.21"

# machine learning
burn = { version = "0.22.1", features = ["signal"], default-features = false }
burn-store = "0.22.1"
pytorch-reader = "0.22.1"

# serialization
serde = "1.0.229"
serde_json = "1.0.154"

# speech & nlp
loqui-g2p = "0.4.0"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "vulkan",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "metal",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "webgpu",
] }

[build-dependencies]
# build tools
burn-onnx = "0.22.0"
hf-hub = "1.0.0"

[build]
jobs = 6

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
