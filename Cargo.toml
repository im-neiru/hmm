[package]
name = "hmm"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]

[dependencies]
# async runtime
tokio = { version = "1.54.0", default-features = false, features = [
    "fs",
    "io-std",
    "io-util",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
] }

# compression
zstd = "0.14.3"
zip = "9.0.5"

# data structures & math
half = "2.7"
hashbrown = "0.17.1"
rustc-hash = "2.1.3"

# error handling
miette = "7.6.0"
thiserror = "2.0.21"

# file mapping
mmap-io = "1.1.0"

# machine learning
burn = { version = "0.22.1", features = ["signal"], default-features = false }
burn-store = "0.22.1"

# serialization
serde = "1.0.229"
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }

# speech & nlp
loqui-g2p = "0.4.0"

# ui
iced = { version = "0.14.0", features = ["tokio"] }

# file system
dirs = "7.0.0"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "vulkan",
    "wgpu",
    "ndarray",
    "flex",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "metal",
    "wgpu",
    "flex",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "0.22.1", default-features = false, features = [
    "signal",
    "webgpu",
    "wgpu",
] }

[build-dependencies]
# build tools
burn-onnx = "0.22.0"
hf-hub = "1.0.0"
pytorch-reader = "0.22.1"
postcard = { version = "1.1.3", features = ["use-std"] }
tokio = { version = "1.54.0", default-features = false, features = [
    "fs",
    "io-std",
    "io-util",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
] }
zstd = "0.14.3"
serde = "1.0.229"
zip = "9.0.5"
heck = "0.5.0"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
